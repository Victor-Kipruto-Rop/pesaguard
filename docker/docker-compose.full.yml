services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pesaguard
      POSTGRES_PASSWORD: pesaguard
      POSTGRES_DB: pesaguard
      POSTGRES_MULTIPLE_DATABASES: pesaguard_reports,pesaguard_audit,pesaguard_worker_state
      POSTGRES_REPLICATION_USER: pesaguard_repl
      POSTGRES_REPLICATION_PASSWORD: pesaguard_repl
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=5
      - -c
      - max_replication_slots=5
      - -c
      - listen_addresses=*

  postgres_replica:
    image: postgres:16
    environment:
      POSTGRES_DB: pesaguard
      POSTGRES_PRIMARY_HOST: postgres
      POSTGRES_REPLICATION_USER: pesaguard_repl
      POSTGRES_REPLICATION_PASSWORD: pesaguard_repl
    volumes:
      - pgdata_replica:/var/lib/postgresql/data
      - ./postgres-replica-entrypoint.sh:/usr/local/bin/postgres-replica-entrypoint.sh:ro
    entrypoint: ["/usr/local/bin/postgres-replica-entrypoint.sh"]

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  backend:
    build: .
    command: python -m pesaguard_backend_pipeline.app
    environment:
      DATABASE_URL: postgresql://pesaguard:pesaguard@postgres:5432/pesaguard
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - kafka

  alerting_consumer:
    build: .
    command: python -m pesaguard_backend_pipeline.alerting_consumer
    environment:
      DATABASE_URL: postgresql://pesaguard:pesaguard@postgres:5432/pesaguard
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PESAGUARD_TOPIC_DISCREPANCIES: mpesa.discrepancies
      PESAGUARD_ALERTING_GROUP_ID: pesaguard-alerting-v1
    depends_on:
      - kafka
      - postgres

  dashboard:
    build: .
    command: python -m pesaguard_backend_pipeline.app
    environment:
      PORT: "5001"
      DATABASE_URL: postgresql://pesaguard:pesaguard@postgres:5432/pesaguard
      READ_REPLICA_DATABASE_URL: postgresql://pesaguard:pesaguard@postgres_replica:5432/pesaguard
    ports:
      - "5001:5001"
    depends_on:
      - postgres
      - postgres_replica

  frontend:
    build:
      context: ./frontend
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://dashboard:5001
    depends_on:
      - dashboard

volumes:
  pgdata:
  pgdata_replica:
