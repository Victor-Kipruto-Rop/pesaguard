name: Python application

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f pesaguard_backend_pipeline/requirements.txt ]; then
            pip install -r pesaguard_backend_pipeline/requirements.txt
          fi

      - name: Test with pytest
        env:
          PYTHONPATH: .
          USE_IN_MEMORY_TEST_DB: "true"
          DARAJA_SHARED_SECRET: test_ci_secret_key_12345
          JWT_SECRET_KEY: test_ci_jwt_secret_key_12345
        run: pytest -q
