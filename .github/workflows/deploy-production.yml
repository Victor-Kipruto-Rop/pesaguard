name: Deploy to production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional image tag override (defaults to current commit SHA)
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Production Pre-Deploy Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pesaguard_backend_pipeline/requirements_3.txt
      - name: Run backend tests
        env:
          PYTHONPATH: .
        run: pytest pesaguard_backend_pipeline/tests/ -q --tb=short

  build-and-push:
    name: Build and Push Production Image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve image tag
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:production
            ghcr.io/${{ github.repository }}/backend:${{ steps.meta.outputs.tag }}

  approval:
    name: Production Approval Gate
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: production
    steps:
      - name: Await manual approval
        run: echo "Approval granted"

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-push, approval]
    environment:
      name: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            cd ${PROD_PATH:-/opt/pesaguard}
            export BACKEND_IMAGE=ghcr.io/${{ github.repository }}/backend:${{ needs.build-and-push.outputs.image_tag }}
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GHCR_DEPLOY_TOKEN }}
            docker compose -f docker/docker-compose.yml pull webhook_receiver dashboard_api reconciliation_job rq_worker alerting_consumer
            docker compose -f docker/docker-compose.yml up -d webhook_receiver dashboard_api reconciliation_job rq_worker alerting_consumer
            docker compose -f docker/docker-compose.yml ps
