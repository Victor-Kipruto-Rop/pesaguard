name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:6
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest prometheus_client rq redis kafka-python sqlalchemy
      - name: Start RQ worker (background)
        run: |
          python scripts/rq_worker.py &
          sleep 2
      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest tests/ pesaguard_backend_pipeline/tests/ -q --tb=short
      - name: End-to-end smoke: start Flask server
        run: |
          export DATABASE_URL=sqlite:///./e2e.db
          export PESAGUARD_ADMIN_API_TOKEN=ci-test-token
          python pesaguard_backend_pipeline/app.py &
          sleep 2
      - name: Post sample webhook and validate persisted record
        run: |
          TRANSID=E2E_TEST_1
          cat > payload.json <<'JSON'
{ "TransactionType": "C2B", "TransID": "${TRANSID}", "TransTime": "20220101120000", "TransAmount": "123.45", "BusinessShortCode": "12345", "MSISDN": "254700000000" }
JSON
          curl -s -X POST -H "Content-Type: application/json" --data @payload.json http://127.0.0.1:5000/webhook/mpesa/confirmation -o /dev/null -w "%{http_code}\n"
          python scripts/admin_query.py ${TRANSID} --db sqlite:///./e2e.db > e2e_out.json
          python - <<'PY'
import json
o=json.load(open('e2e_out.json'))
assert 'E2E_TEST_1' in o and o['E2E_TEST_1'] is not None
print('E2E OK')
PY
      - name: Install frontend dependencies (optional)
        run: |
          if [ -f frontend/package.json ]; then
            npm --prefix frontend ci --omit=optional
          fi
        continue-on-error: true

  e2e:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        db: [sqlite, postgres]
    services: {}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest prometheus_client rq redis kafka-python sqlalchemy psycopg2-binary
      - name: Start DB service (Postgres matrix)
        if: matrix.db == 'postgres'
        uses: harmon758/postgresql-action@v2
        with:
          postgresql version: '13'
          postgresql db: 'pesaguard'
          postgresql user: 'pesaguard'
          postgresql password: 'pesaguard'
      - name: Start Redis for e2e
        uses: docker://redis:6
        continue-on-error: true
      - name: Start RQ worker
        run: |
          python scripts/rq_worker.py &
          sleep 2
      - name: Start Flask and run e2e smoke
        env:
          DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql://pesaguard:pesaguard@localhost:5432/pesaguard' || 'sqlite:///./e2e.db' }}
          PESAGUARD_ADMIN_API_TOKEN: ci-test-token
        run: |
          python pesaguard_backend_pipeline/app.py &
          sleep 3
          TRANSID=E2E_TEST_MATRIX
          cat > payload.json <<'JSON'
{ "TransactionType": "C2B", "TransID": "${TRANSID}", "TransTime": "20220101120000", "TransAmount": "77.77", "BusinessShortCode": "12345", "MSISDN": "254700000000" }
JSON
          curl -s -X POST -H "Content-Type: application/json" --data @payload.json http://127.0.0.1:5000/webhook/mpesa/confirmation -o /dev/null -w "%{http_code}\n"
          if [ "${{ matrix.db }}" = "postgres" ]; then
            python scripts/admin_query.py ${TRANSID} --db postgresql://pesaguard:pesaguard@localhost:5432/pesaguard > e2e_out.json
          else
            python scripts/admin_query.py ${TRANSID} --db sqlite:///./e2e.db > e2e_out.json
          fi
          python - <<'PY'
import json
o=json.load(open('e2e_out.json'))
assert 'E2E_TEST_MATRIX' in o and o['E2E_TEST_MATRIX'] is not None
print('E2E MATRIX OK')
PY
