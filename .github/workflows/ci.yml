name: CI

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pesaguard
          POSTGRES_PASSWORD: pesaguard
          POSTGRES_DB: pesaguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pesaguard -d pesaguard"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pesaguard_backend_pipeline/requirements_3.txt
          pip install pytest
          pip check
      - name: Run backend tests
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql://pesaguard:pesaguard@localhost:5432/pesaguard
          REDIS_URL: redis://localhost:6379/0
          PESAGUARD_API_AUTH_REQUIRED: "1"
        run: pytest pesaguard_backend_pipeline/tests/ -q --tb=short
      - name: Start webhook API for smoke test
        env:
          DATABASE_URL: sqlite:///./e2e.db
          REDIS_URL: redis://localhost:6379/0
          PESAGUARD_ADMIN_API_TOKEN: ci-test-token
        run: |
          python -m pesaguard_backend_pipeline.app &
          echo $! > flask.pid
          sleep 3
      - name: Health endpoint smoke test
        run: |
          status=$(curl -s -o /tmp/health.json -w "%{http_code}" http://127.0.0.1:5000/health)
          cat /tmp/health.json
          if [ "$status" -ne 200 ]; then
            echo "Health endpoint returned HTTP $status"
            exit 1
          fi
      - name: Post sample webhook and validate persisted record
        run: |
          TRANSID=E2E_TEST_1
          printf '{ "TransactionType": "C2B", "TransID": "%s", "TransTime": "20220101120000", "TransAmount": "123.45", "BusinessShortCode": "12345", "MSISDN": "254700000000" }\n' "$TRANSID" > payload.json
          curl -s -X POST -H "Content-Type: application/json" --data @payload.json http://127.0.0.1:5000/webhook/mpesa/confirmation -o /dev/null -w "%{http_code}\n"
          python -m pesaguard_backend_pipeline.scripts.admin_query ${TRANSID} --db sqlite:///./e2e.db > e2e_out.json
          python -c "import json; o=json.load(open('e2e_out.json')); assert 'E2E_TEST_1' in o and o['E2E_TEST_1'] is not None; print('E2E OK')"
      - name: Stop webhook API
        if: always()
        run: |
          if [ -f flask.pid ]; then
            kill $(cat flask.pid) || true
          fi
      - name: Validate docker compose definitions
        run: |
          docker compose -f docker/docker-compose.yml config >/dev/null
          docker compose -f docker/docker-compose.full.yml config >/dev/null

  image-build:
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        run: docker build . --file docker/Dockerfile --tag pesaguard-backend:${{ github.sha }}
      - name: Build frontend image (best-effort)
        run: |
          docker build . --file docker/Dockerfile.frontend --tag pesaguard-frontend:${{ github.sha }}
        continue-on-error: true
